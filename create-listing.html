<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Listing | York Realty</title>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="google_translate_element" class="mb-2"></div>
  <nav class="navbar navbar-expand-lg navbar-dark bg-danger px-4">
    <a class="navbar-brand text-white fw-bold" href="#">York Realty</a>
    <div class="ms-auto d-flex gap-2">
      <a href="index.html" class="btn btn-dark">Home</a>
      <a href="listings.html" class="btn btn-dark">Listings</a>
      <a href="create-listing.html" class="btn btn-dark">Create Listing</a>
      <a href="faq.html" class="btn btn-dark">FAQ</a>
      <a href="login.html" class="btn btn-dark">Login</a>
      <a href="register.html" class="btn btn-dark">Register</a>
    </div>
  </nav>

  <div class="container my-4">
    <h2>Create a New Listing</h2>
    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control" placeholder="Title (e.g. C$3200/Mo)" />
        </div>
        <div class="col-md-6">
          <select class="form-select">
            <option selected disabled>Listing Type</option>
            <option value="rent">Rent</option>
            <option value="sale">Sale</option>
          </select>
        </div>

        <div class="col-md-4">
          <input type="number" class="form-control" placeholder="Bedrooms" />
        </div>
        <div class="col-md-4">
          <input type="number" class="form-control" placeholder="Bathrooms" />
        </div>
        <div class="col-md-4">
          <input type="number" class="form-control" placeholder="Square Footage" />
        </div>

        <div class="col-12">
          <input type="text" class="form-control" placeholder="Address" />
        </div>
        <div class="col-12">
          <input type="text" class="form-control" placeholder="Postal Code" />
        </div>
        <div class="col-12">
          <textarea class="form-control" rows="4" placeholder="Property Description"></textarea>
        </div>
        <div class="col-12">
          <input type="file" class="form-control" multiple />
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-danger">Submit Listing</button>
        </div>
      </div>
    </form>
  </div>
</body>
</html>
