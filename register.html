<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | York Realty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,fr',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="google_translate_element" class="mb-2"></div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger px-4">
        <a class="navbar-brand text-white fw-bold" href="#">York Realty</a>
        <div class="ms-auto d-flex gap-2">
          <a href="index.html" class="btn btn-dark">Home</a>
          <a href="listings.html" class="btn btn-dark">Listings</a>
          <a href="create-listing.html" class="btn btn-dark">Create Listing</a>
          <a href="faq.html" class="btn btn-dark">FAQ</a>
          <a href="login.html" class="btn btn-dark">Login</a>
          <a href="register.html" class="btn btn-dark">Register</a>
        </div>
      </nav>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Create an Account</h2>
    <form class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Full Name" />
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email Address" />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Password" />
      </div>
      <button type="submit" class="btn btn-danger w-100">Register</button>
    </form>
  </div>
</body>
</html>
